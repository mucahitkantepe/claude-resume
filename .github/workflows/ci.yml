name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install tmux (the TUI end-to-end tests drive the binary inside tmux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Build without the semantic model
        run: |
          cargo clippy --all-targets --locked --no-default-features -- -D warnings
          cargo test --locked --no-default-features
      - name: Lint the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/record-demo.sh
